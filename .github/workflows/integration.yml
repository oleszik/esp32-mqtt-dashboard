name: Integration

on:
  push:
    branches: [main, feature/esp32-mqtt-dashboard-mvp]
  pull_request:
  workflow_dispatch:

jobs:
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/integration_test.py
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-output
          path: docs/integration-test-output.txt
          if-no-files-found: ignore

