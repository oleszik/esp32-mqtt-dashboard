[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esp32-mqtt-dashboard-backend"
version = "1.0.0"
description = "MQTT telemetry ingestion, persistence, API, and dashboard"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "paho-mqtt==2.1.0",
  "pydantic-settings==2.9.1",
  "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "ruff==0.11.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

