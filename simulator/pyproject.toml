[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esp32-mqtt-device-simulator"
version = "1.0.0"
description = "Deterministic MQTT telemetry device simulator"
requires-python = ">=3.11"
dependencies = ["paho-mqtt==2.1.0"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.8"]

[project.scripts]
esp32-mqtt-simulator = "simulator.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

